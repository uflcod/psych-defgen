[project]
name = "psych-defgen"
version = "0.0.1b1"
description = "A Python package for retrieving and synthesizing evidence-based definitions of psychological constructs from scientific literature using configurable language models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Damayanthi Jesudas", email = "6574003+jesudas@users.noreply.github.com" },
    { name = "William Duncan", email = "wdduncan@users.noreply.github.com" }
]
requires-python = ">=3.11"

dependencies = [
    "biopython",
    "beautifulsoup4",
    "click>=8.0",
    "lxml",
    "numpy",
    "pandas",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "tqdm",
    "playwright==1.62.0",
    "streamlit",
    "ollama>=0.6.3",
    "openai>=2.9.0",
]

[project.scripts]
psych-defgen = "psych_defgen.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
